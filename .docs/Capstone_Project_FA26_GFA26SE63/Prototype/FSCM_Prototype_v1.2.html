:root{--bg:#E4E7E2;--ink:#1B1F1D;--muted:#5B625E;--line:#D3D8D2;--brand:#14655B;--card:#FFFFFF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif}
header{position:sticky;top:0;z-index:10;background:#16302B;color:#fff;display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
header .sub{font-size:12px;color:#A9C2BA}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{font:inherit;font-size:13.5px;font-weight:600;border:1px solid #35564E;background:transparent;color:#DDE6E2;border-radius:8px;padding:8px 14px;cursor:pointer}
nav button[aria-pressed="true"]{background:#14655B;border-color:#14655B;color:#fff}
.tools{margin-left:auto;display:flex;gap:8px}
.tools button{font:inherit;font-size:12.5px;font-weight:600;border:1px solid #35564E;background:transparent;color:#DDE6E2;border-radius:8px;padding:7px 12px;cursor:pointer}
main{padding:24px 20px 40px}
.stage{display:none;gap:28px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.stage.on{display:flex}
.phone{width:390px;height:844px;border-radius:32px;overflow:hidden;background:#fff;box-shadow:0 0 0 10px #1B1F1D,0 18px 50px rgba(0,0,0,.25);flex:0 0 auto;margin:10px}
.web{background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.18);border-radius:10px;overflow:hidden;flex:0 0 auto}
.note{max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;color:#2E3532}
.note b{display:block;font-size:14px;margin-bottom:6px}
.stage.web-stage{flex-direction:column;align-items:center}
.stage.web-stage .note{max-width:1440px;width:100%}
details.note summary{cursor:pointer;font-weight:700}
@media (max-width:860px){.note{max-width:390px}}

y\" disabled=\"{{disc.invalid}}\" onClick=\"{{disc.submit}}\">Gửi khiếu nại<\/button>\n<\/div>\n<\/sc-if>\n\n<!-- ========== PAYMENTS ========== -->\n<sc-if value=\"{{is.payments}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"hdr\"><button class=\"iconbtn\" aria-label=\"Quay lại\" onClick=\"{{goOrders}}\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"/><\/svg><\/button><div style=\"flex: 1\"><h1>Thanh toán<\/h1><div class=\"muted\" style=\"font-size: 12.5px\">Tổng tiền đã thanh toán theo kỳ<\/div><\/div><\/div>\n<div class=\"scroll\" style=\"padding: 16px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; gap: 8px\">\n<sc-for list=\"{{periods}}\" as=\"p\" hint-placeholder-count=\"2\">\n<button class=\"chip\" style=\"{{p.style}}; height: 36px; padding: 0 14px; cursor: pointer; font-size: 13px\" onClick=\"{{p.pick}}\">{{p.label}}<\/button>\n<\/sc-for>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n<div class=\"card\" style=\"padding: 14px\"><div class=\"muted\" style=\"font-size: 12.5px\">Số đơn đã thanh toán<\/div><div style=\"font-size: 26px; font-weight: 700\">{{pay.count}}<\/div><\/div>\n<div class=\"card\" style=\"padding: 14px\"><div class=\"muted\" style=\"font-size: 12.5px\">Tổng đã thanh toán<\/div><div style=\"font-size: 18px; font-weight: 700; color: #14655B; margin-top: 4px\">{{pay.totalF}}<\/div><\/div>\n<\/div>\n<div class=\"card\" style=\"overflow: hidden\">\n<sc-for list=\"{{pay.list}}\" as=\"x\" hint-placeholder-count=\"3\">\n<button class=\"rowlink\" onClick=\"{{x.open}}\">\n<span style=\"flex: 1; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-weight: 600; font-size: 14px\">{{x.id}}<\/span><span class=\"muted\" style=\"font-size: 12.5px\">{{x.date}} · {{x.method}}<\/span><\/span>\n<span style=\"font-weight: 700; font-size: 14px\">{{x.finalF}}<\/span>\n<\/button>\n<\/sc-for>\n<\/div>\n<sc-if value=\"{{debts.has}}\" hint-placeholder-val=\"{{ false }}\">\n<h2 class=\"sec\" style=\"margin-top: 4px\">Công nợ còn phải trả · {{debts.totalF}}<\/h2>\n<div class=\"card\" style=\"overflow: hidden\">\n<sc-for list=\"{{debts.list}}\" as=\"x\" hint-placeholder-count=\"1\">\n<button class=\"rowlink\" onClick=\"{{x.open}}\">\n<span style=\"flex: 1; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-weight: 600; font-size: 14px\">{{x.id}}<\/span><span class=\"muted\" style=\"font-size: 12.5px\">{{x.sub}}<\/span><\/span>\n<span style=\"font-weight: 700; font-size: 14px; color: #B42318\">{{x.remainF}}<\/span>\n<\/button>\n<\/sc-for>\n<\/div>\n<\/sc-if>\n<p class=\"muted\" style=\"margin: 0; font-size: 12.5px; line-height: 1.5\">Số tiền là thành tiền sau khuyến mãi. Đơn công nợ: nhận hàng, bán rồi trả trước hạn (ngày giao + 14 ngày); trả tiền mặt cho Sales hoặc chuyển khoản.<\/p>\n<\/div>\n<\/sc-if>\n\n<!-- ========== LOYALTY ========== -->\n<sc-if value=\"{{is.loyalty}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"hdr\"><button class=\"iconbtn\" aria-label=\"Quay lại\" onClick=\"{{goOrders}}\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"/><\/svg><\/button><div style=\"flex: 1\"><h1>Điểm &amp; hạng thành viên<\/h1><div class=\"muted\" style=\"font-size: 12.5px\">Điểm tính trong 90 ngày gần nhất<\/div><\/div><\/div>\n<div class=\"scroll\" style=\"padding: 16px; display: flex; flex-direction: column; gap: 12px\">\n<div class=\"card\" style=\"padding: 18px; display: flex; flex-direction: column; gap: 10px; background: #FBF5E2; border-color: #EBD9A3\">\n<span style=\"font-size: 13px; color: #7A5200; font-weight: 600\">Hạng hiện tại<\/span>\n<span style=\"font-size: 28px; font-weight: 700; color: #5C3D00\">{{L.tier}} · {{L.pts}} điểm<\/span>\n<div style=\"height: 10px; border-radius: 5px; background: #F1E3B5\"><div style=\"{{L.barStyle}}\"><\/div><\/div>\n<span style=\"font-size: 13px; color: #7A5200\">Cần thêm {{L.need}} điểm để lên {{L.next}} (600 điểm)<\/span>\n<\/div>\n<div class=\"card\" style=\"padding: 12px 14px; font-size: 13px; line-height: 1.5; color: #3D4441\">Tích 1 điểm cho mỗi 100.000đ thanh toán (sau khuyến mãi). Điểm được cộng khi đơn đã giao và đã thanh toán. Đổi 1 điểm = 1.000đ trừ vào đơn kế tiếp – báo Sales khi đặt hàng.<\/div>\n<h2 class=\"sec\">Quyền lợi theo hạng<\/h2>\n<div class=\"card\" style=\"overflow: hidden\">\n<sc-for list=\"{{L.tiers}}\" as=\"x\" hint-placeholder-count=\"4\"><div style=\"{{x.style}}\"><span style=\"flex: 1; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-weight: 700; font-size: 14px\">{{x.name}}<\/span><span class=\"muted\" style=\"font-size: 12.5px\">{{x.perk}}<\/span><\/span><span class=\"muted\" style=\"font-size: 12.5px\">{{x.need}}<\/span><\/div><\/sc-for>\n<\/div>\n<h2 class=\"sec\">Lịch sử điểm<\/h2>\n<div class=\"card\" style=\"overflow: hidden\">\n<sc-for list=\"{{L.hist}}\" as=\"h\" hint-placeholder-count=\"4\"><div style=\"padding: 12px 14px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #EEF0EC\"><span style=\"flex: 1; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px\">{{h.text}}<\/span><span class=\"muted\" style=\"font-size: 12px\">{{h.date}}/2026<\/span><\/span><span style=\"{{h.style}}\">{{h.pts}}<\/span><\/div><\/sc-for>\n<\/div>\n<\/div>\n<\/sc-if>\n\n<!-- ========== NOTIFICATIONS ========== -->\n<sc-if value=\"{{is.notifs}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"hdr\"><button class=\"iconbtn\" aria-label=\"Quay lại\" onClick=\"{{goOrders}}\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"/><\/svg><\/button><div style=\"flex: 1\"><h1>Thông báo<\/h1><\/div><button class=\"btn-text\" onClick=\"{{readAll}}\">Đánh dấu đã đọc<\/button><\/div>\n<div class=\"scroll\">\n<sc-for list=\"{{notifList}}\" as=\"n\" hint-placeholder-count=\"3\">\n<button class=\"rowlink\" style=\"{{n.rowStyle}}\" onClick=\"{{n.open}}\">\n<span style=\"{{n.dotStyle}}\"><\/span>\n<span style=\"flex: 1; display: flex; flex-direction: column; gap: 3px\"><span style=\"font-size: 14px; line-height: 1.45\">{{n.text}}<\/span><span class=\"muted\" style=\"font-size: 12px\">{{n.time}}<\/span><\/span>\n<\/button>\n<\/sc-for>\n<\/div>\n<\/sc-if>\n\n<!-- ========== ACCOUNT ========== -->\n<sc-if value=\"{{is.account}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"hdr\" style=\"padding-left: 16px\"><div style=\"flex: 1\"><h1>Tài khoản<\/h1><\/div><button class=\"iconbtn\" aria-label=\"Thông báo\" onClick=\"{{goNotifs}}\" style=\"position: relative\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 16V11a6 6 0 0 1 12 0v5l2 2H4z\"/><path d=\"M10 21h4\"/><\/svg><sc-if value=\"{{hasUnread}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"badge\" style=\"top: 4px; left: auto; right: 4px; margin: 0\">{{unreadCount}}<\/span><\/sc-if><\/button><\/div>\n<div class=\"scroll\" style=\"display: flex; flex-direction: column\">\n<div style=\"padding: 20px 16px; display: flex; gap: 14px; align-items: center; background: #FFFFFF; border-bottom: 1px solid #E2E5E0\">\n<div style=\"width: 56px; height: 56px; border-radius: 50%; background: #1F4E79; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px\">MC<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-weight: 700; font-size: 16px\">Tạp hóa Minh Châu<\/span><span class=\"muted\" style=\"font-size: 13px\">12 Lê Văn Khương, P. Thới An, Q.12<\/span><span class=\"muted\" style=\"font-size: 13px\">Mã 10004127 · 0909 555 127<\/span><\/div>\n<\/div>\n<div style=\"margin-top: 12px\">\n<button class=\"rowlink\" onClick=\"{{goLoyalty}}\"><span style=\"flex: 1\">Điểm &amp; hạng thành viên<\/span><span class=\"muted\" style=\"font-size: 13px; margin-right: 6px\">{{L.tier}} · {{L.pts}} điểm<\/span><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5B625E\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M9 5l7 7-7 7\"/><\/svg><\/button>\n<button class=\"rowlink\" onClick=\"{{goPayments}}\"><span style=\"flex: 1\">Thanh toán &amp; công nợ<\/span><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5B625E\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M9 5l7 7-7 7\"/><\/svg><\/button>\n<div class=\"rowlink\" style=\"cursor: default\"><span style=\"flex: 1\">Sales phụ trách<\/span><span class=\"muted\" style=\"font-size: 14px\">Nguyễn Văn An · nhóm Q12-A<\/span><\/div>\n<button class=\"rowlink\" onClick=\"{{toastPw}}\"><span style=\"flex: 1\">Đổi mật khẩu<\/span><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5B625E\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M9 5l7 7-7 7\"/><\/svg><\/button>\n<button class=\"rowlink\" style=\"color: #B42318\" onClick=\"{{logout}}\"><span style=\"flex: 1\">Đăng xuất<\/span><\/button>\n<\/div>\n<\/div>\n<\/sc-if>\n\n<!-- ========== SCAN HUB ========== -->\n<sc-if value=\"{{is.scanhub}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"hdr\" style=\"padding-left: 16px\"><div style=\"flex: 1\"><h1>Quét QR<\/h1><div class=\"muted\" style=\"font-size: 12.5px\">Quét tem trên kiện hàng để nhận hàng<\/div><\/div><button class=\"iconbtn\" aria-label=\"Thông báo\" onClick=\"{{goNotifs}}\" style=\"position: relative\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 16V11a6 6 0 0 1 12 0v5l2 2H4z\"/><path d=\"M10 21h4\"/><\/svg><sc-if value=\"{{hasUnread}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"badge\" style=\"top: 4px; left: auto; right: 4px; margin: 0\">{{unreadCount}}<\/span><\/sc-if><\/button><\/div>\n<div class=\"scroll\" style=\"padding: 16px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"height: 240px; border-radius: 16px; background: #1B1F1D; position: relative; display: flex; align-items: center; justify-content: center\">\n<div style=\"width: 160px; height: 160px; border: 3px solid #FFFFFF; border-radius: 18px; opacity: 0.85\"><\/div>\n<span style=\"position: absolute; bottom: 14px; color: #E6E9E4; font-size: 12.5px\">Đưa tem QR trên kiện hàng vào khung<\/span>\n<\/div>\n<p class=\"muted\" style=\"margin: 0; font-size: 13px; line-height: 1.5\">Hệ thống tự tìm đơn đang giao chứa tem này và mở màn nhận hàng. Tem không thuộc đơn của cửa hàng sẽ bị báo lỗi.<\/p>\n<span class=\"sec\">Giả lập quét (prototype)<\/span>\n<button class=\"btn btn-primary\" onClick=\"{{hubScanOk}}\">Quét TEM-000187 (thuộc đơn DH-1021)<\/button>\n<button class=\"btn btn-outline\" style=\"color: #B42318; border-color: #E7B4AE\" onClick=\"{{hubScanBad}}\">Quét tem của cửa hàng khác<\/button>\n<sc-if value=\"{{hubErr}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"background: #FDECEA; color: #8F1D14; border-radius: 12px; padding: 12px 14px; font-size: 13.5px; line-height: 1.5\"><strong>Tem không thuộc đơn của bạn:<\/strong> TEM-000204 thuộc đơn DH-1024 (Cửa hàng tiện lợi An Phú). Không ghi nhận.<\/div><\/sc-if>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{showTabs}}\" hint-placeholder-val=\"{{ false }}\">\n<nav class=\"tabbar\" aria-label=\"Điều hướng chính\">\n<button class=\"tab\" style=\"{{tabStyle.orders}}\" onClick=\"{{goOrders}}\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"/><path d=\"M9 9h6M9 13h6M9 17h4\"/><\/svg>Đơn hàng<\/button>\n<button class=\"tab\" style=\"{{tabStyle.scanhub}}\" onClick=\"{{goHub}}\" aria-label=\"Quét QR\"><span class=\"scanfab\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4\"/><path d=\"M7 12h10\"/><\/svg><\/span>Quét QR<\/button>\n<button class=\"tab\" style=\"{{tabStyle.account}}\" onClick=\"{{goAccount}}\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6\"/><\/svg>Tài khoản<\/button>\n<\/nav>\n<\/sc-if>\n\n<sc-if value=\"{{hasToast}}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"position: absolute; left: 16px; right: 16px; bottom: 84px; background: #1B1F1D; color: #FFFFFF; border-radius: 12px; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; z-index: 30\">{{toast}}<\/div>\n<\/sc-if>\n<\/div>\n", "css": "\nbody{margin:0;background:#E9EBE6;font-family:'Be Vietnam Pro',system-ui,sans-serif}\n*{box-sizing:border-box}\nbutton,input,textarea{font-family:inherit}\na{color:#14655B}a:hover{color:#0E4B43}\n.scroll{flex:1 1 auto;overflow-y:auto;min-height:0}\n.scroll>*{flex-shrink:0}\n.card{background:#FFFFFF;border:1px solid #E2E5E0;border-radius:14px}\n.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;width:100%}\n.btn-primary{background:#14655B;color:#FFFFFF}\n.btn-primary:disabled{background:#A7B8B3;cursor:not-allowed}\n.btn-outline{background:#FFFFFF;color:#14655B;border:1.5px solid #14655B}\n.btn-text{background:transparent;color:#14655B;border:none;font-weight:600;cursor:pointer;font-size:14px;padding:10px 6px;min-height:44px}\n.iconbtn{width:44px;height:44px;flex:0 0 44px;border-radius:12px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#1B1F1D}\n.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#3D4441}\n.input{min-height:48px;border:1px solid #C9D0CB;border-radius:12px;padding:0 14px;font-size:15px;background:#FFFFFF;color:#1B1F1D;font-weight:400;width:100%}\n.muted{color:#5B625E}\n.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}\n.hdr{display:flex;align-items:center;gap:4px;padding:8px 12px 8px 4px;background:#FFFFFF;border-bottom:1px solid #E2E5E0;min-height:62px;flex:0 0 auto}\n.hdr h1{margin:0;font-size:18px;font-weight:700;line-height:1.2}\n.sec{font-size:12px;font-weight:700;color:#4A524E;text-transform:uppercase;letter-spacing:.05em;margin:0}\n.tabbar{display:flex;background:#FFFFFF;border-top:1px solid #E2E5E0;height:68px;flex:0 0 auto}\n.tab{flex:1;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;cursor:pointer;position:relative}\n.badge{position:absolute;top:6px;left:50%;margin-left:6px;background:#B42318;color:#FFFFFF;border-radius:999px;font-size:10px;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center;font-weight:700}\n.promo{background:#FEF3E2;color:#8A3B09}\n.rowlink{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 14px;background:#FFFFFF;border:none;border-bottom:1px solid #EEF0EC;text-align:left;cursor:pointer;font-size:15px;color:#1B1F1D}\n.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}\n.scanfab{width:58px;height:58px;border-radius:50%;background:#14655B;color:#FFFFFF;display: <script>
(function(){
  var _cb=null,_pending=null;
  window.addEventListener('message',function(e){
    if(e.data&&e.data.type==='mapPick'){
      _pending=[e.data.lat,e.data.lng];
      var el=document.getElementById('fscm-map-info');
      if(el) el.textContent='Lat: '+e.data.lat.toFixed(6)+'   Lng: '+e.data.lng.toFixed(6);
    }
  });
  window.openMapPicker=function(curLat,curLng,callback){
    _cb=callback; _pending=null;
    var lat=parseFloat(curLat)||10.8231,lng=parseFloat(curLng)||106.6297;
    var modal=document.getElementById('fscm-map-modal');
    var frame=document.getElementById('fscm-map-frame');
    modal.style.display='flex';
    // reload iframe with new coordinates via src hash trick
    frame.contentWindow.location.hash=lat+','+lng;
    // if map already loaded just re-center, else srcdoc handles init
    try{
      var w=frame.contentWindow;
      if(w.map){w.map.setView([lat,lng],15);if(w.mk)w.mk.setLatLng([lat,lng]);}
    }catch(e){}
  };
  window._fscmMapClose=function(){ document.getElementById('fscm-map-modal').style.display='none'; };
  window._fscmMapConfirm=function(){ if(_pending&&_cb) _cb(_pending[0],_pending[1]); window._fscmMapClose(); };
})();
</script>
